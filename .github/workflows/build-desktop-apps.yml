name: Build Desktop Apps

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            name: 'macOS'
            extension: 'dmg'
          - platform: 'ubuntu-22.04'
            args: ''
            name: 'Linux'
            extension: 'AppImage'
          - platform: 'windows-latest'
            args: ''
            name: 'Windows'
            extension: 'exe'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Project Pilot Sync v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProjectPilot-Sync-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  create-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -la artifacts/

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Project Pilot Sync v${{ github.run_number }}
          body: |
            ## Project Pilot Sync - Native Desktop Application
            
            ### הורדה והתקנה
            
            **macOS**: הורד את קובץ ה-DMG, פתח אותו וגרור את האפליקציה לתיקיית Applications
            **Windows**: הורד את קובץ ה-EXE והפעל אותו
            **Linux**: הורד את קובץ ה-AppImage והפעל אותו (או הוסף הרשאות הפעלה)
            
            ### תכונות עיקריות
            ✅ פתיחת תיקיות ב-Finder/Explorer  
            ✅ פתיחת WhatsApp שולחני  
            ✅ פתיחת מייל  
            ✅ חיוג טלפוני  
            ✅ ממשק משתמש מודרני בסגנון Apple  
            ✅ תמיכה בעברית מלאה  
            
            Built with ❤️ using Tauri + React + TypeScript
          draft: false
          prerelease: false

      - name: Upload DMG (macOS)
        if: always()
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/ProjectPilot-Sync-macOS/*.dmg
          asset_name: ProjectPilot-Sync-Mac.dmg
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Upload AppImage (Linux)
        if: always()
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/ProjectPilot-Sync-Linux/*.AppImage
          asset_name: ProjectPilot-Sync-Linux.AppImage
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Upload EXE (Windows)
        if: always()
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/ProjectPilot-Sync-Windows/*.exe
          asset_name: ProjectPilot-Sync-Windows.exe
          asset_content_type: application/octet-stream
        continue-on-error: true